name: Build Wenzgram Windows Release

on:
  workflow_dispatch:
    inputs:
      force_rebuild_libs:
        description: 'Force rebuild libraries cache (~4 hours)'
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'cursor/**'

permissions:
  contents: write

env:
  BUILD_CONFIG: Release

jobs:
  check-cache:
    name: Check libraries cache
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      libs-cached: ${{ steps.verify.outputs.libs-cached }}
      cache-key: ${{ steps.config.outputs.cache-key }}
      tdesktop-ref: ${{ steps.config.outputs.tdesktop-ref }}
      sdk: ${{ steps.config.outputs.sdk }}

    steps:
      - name: Checkout Wenzgram
        uses: actions/checkout@v4

      - name: Read CI config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          source ci/windows-build.env
          echo "CACHE_KEY=$LIBS_CACHE_KEY" >> "$GITHUB_ENV"
          echo "TDESKTOP_REF=$TDESKTOP_REF" >> "$GITHUB_ENV"
          echo "SDK=$WIN_SDK_VERSION" >> "$GITHUB_ENV"
          echo "cache-key=$LIBS_CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "tdesktop-ref=$TDESKTOP_REF" >> "$GITHUB_OUTPUT"
          echo "sdk=$WIN_SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare directories on D drive
        shell: cmd
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries\win64
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Lookup ThirdParty cache
        uses: actions/cache/restore@v4
        id: cache-third-party
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          lookup-only: true

      - name: Lookup Libraries cache
        uses: actions/cache/restore@v4
        id: cache-libs
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-${{ runner.arch }}-libs-${{ env.CACHE_KEY }}
          lookup-only: true

      - name: Lookup Qt cache
        uses: actions/cache/restore@v4
        id: cache-qt
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-${{ runner.arch }}-qt6-${{ env.CACHE_KEY }}
          lookup-only: true

      - name: Verify cache status
        id: verify
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild_libs == 'true' }}
        run: |
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "Force rebuild requested."
            echo "libs-cached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.cache-third-party.outputs.cache-hit }}" = "true" ] \
            && [ "${{ steps.cache-libs.outputs.cache-hit }}" = "true" ] \
            && [ "${{ steps.cache-qt.outputs.cache-hit }}" = "true" ]; then
            echo "All library caches found for key ${CACHE_KEY}."
            echo "libs-cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "Library cache miss for key ${CACHE_KEY}."
            echo "libs-cached=false" >> "$GITHUB_OUTPUT"
          fi

  prepare-libraries:
    name: Prepare libraries (cached)
    needs: check-cache
    if: needs.check-cache.outputs.libs-cached != 'true'
    runs-on: windows-latest
    timeout-minutes: 240

    env:
      CACHE_KEY: ${{ needs.check-cache.outputs.cache-key }}
      TDESKTOP_REF: ${{ needs.check-cache.outputs.tdesktop-ref }}
      SDK: ${{ needs.check-cache.outputs.sdk }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories on D drive
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries\win64
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout Wenzgram
        uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\Wenzgram-src

      - name: Clone Telegram Desktop with submodules
        shell: bash
        env:
          TDESKTOP_REF: ${{ env.TDESKTOP_REF }}
        run: |
          set -euo pipefail
          git clone --recursive --filter=blob:none --no-checkout \
            https://github.com/telegramdesktop/tdesktop.git \
            "$TBUILD/tdesktop"
          cd "$TBUILD/tdesktop"
          git checkout "$TDESKTOP_REF"
          git submodule update --init --recursive --depth 1

      - name: Apply Wenzgram patches
        shell: bash
        run: |
          chmod +x "$TBUILD/Wenzgram-src/scripts/apply-wenzgram-patches.sh"
          "$TBUILD/Wenzgram-src/scripts/apply-wenzgram-patches.sh" \
            "$TBUILD/Wenzgram-src/telegram-desktop" \
            "$TBUILD/tdesktop"
          PREPARE_PY="$TBUILD/tdesktop/Telegram/build/prepare/prepare.py"
          sed -i 's|cd tools\\windows\\dump_syms|REM cd tools\\windows\\dump_syms|' "$PREPARE_PY"
          sed -i 's|gyp dump_syms.gyp --format=msvs|REM gyp dump_syms.gyp --format=msvs|' "$PREPARE_PY"
          sed -i 's|msbuild -m dump_syms.vcxproj.*|REM dump_syms skipped in CI|' "$PREPARE_PY"

      - name: Fix CMake
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache
        uses: actions/cache/restore@v4
        id: cache-third-party
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-third-party-

      - name: Restore Libraries cache
        uses: actions/cache/restore@v4
        id: cache-libs
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-libs-

      - name: Restore Qt cache
        uses: actions/cache/restore@v4
        id: cache-qt
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-qt6-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-qt6-

      - name: Prepare libraries (Release only)
        id: prepare_libs
        if: steps.cache-third-party.outputs.cache-hit != 'true' || steps.cache-libs.outputs.cache-hit != 'true' || steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent qt6

      - name: Verify libraries are present
        if: steps.prepare_libs.outcome == 'skipped'
        shell: bash
        run: |
          if [ ! -d "$LibrariesPath/local" ]; then
            echo "Expected cached libraries are missing." >&2
            exit 1
          fi

      - name: Free disk space after prepare
        if: success()
        shell: bash
        run: |
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete
          rm -rf "$TBUILD/tdesktop/.git" "$TBUILD/Wenzgram-src/.git" 2>/dev/null || true

      - name: Save ThirdParty cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-libs-${{ env.CACHE_KEY }}

      - name: Save Qt cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-qt6-${{ env.CACHE_KEY }}

  build-windows:
    name: Build Wenzgram.exe (Release)
    needs: [check-cache, prepare-libraries]
    if: |
      always() &&
      !cancelled() &&
      needs.check-cache.result == 'success' &&
      (needs.check-cache.outputs.libs-cached == 'true' || needs.prepare-libraries.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      CACHE_KEY: ${{ needs.check-cache.outputs.cache-key }}
      TDESKTOP_REF: ${{ needs.check-cache.outputs.tdesktop-ref }}
      SDK: ${{ needs.check-cache.outputs.sdk }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories on D drive
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries\win64
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout Wenzgram
        uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\Wenzgram-src

      - name: Clone Telegram Desktop with submodules
        shell: bash
        env:
          TDESKTOP_REF: ${{ env.TDESKTOP_REF }}
        run: |
          set -euo pipefail
          git clone --recursive --filter=blob:none --no-checkout \
            https://github.com/telegramdesktop/tdesktop.git \
            "$TBUILD/tdesktop"
          cd "$TBUILD/tdesktop"
          git checkout "$TDESKTOP_REF"
          git submodule update --init --recursive --depth 1

      - name: Apply Wenzgram patches
        shell: bash
        run: |
          chmod +x "$TBUILD/Wenzgram-src/scripts/apply-wenzgram-patches.sh"
          "$TBUILD/Wenzgram-src/scripts/apply-wenzgram-patches.sh" \
            "$TBUILD/Wenzgram-src/telegram-desktop" \
            "$TBUILD/tdesktop"
          PREPARE_PY="$TBUILD/tdesktop/Telegram/build/prepare/prepare.py"
          sed -i 's|cd tools\\windows\\dump_syms|REM cd tools\\windows\\dump_syms|' "$PREPARE_PY"
          sed -i 's|gyp dump_syms.gyp --format=msvs|REM gyp dump_syms.gyp --format=msvs|' "$PREPARE_PY"
          sed -i 's|msbuild -m dump_syms.vcxproj.*|REM dump_syms skipped in CI|' "$PREPARE_PY"

      - name: Fix CMake
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Restore Libraries cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-libs-${{ env.CACHE_KEY }}

      - name: Restore Qt cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-qt6-${{ env.CACHE_KEY }}

      - name: Verify libraries are present
        shell: bash
        run: |
          if [ ! -d "$LibrariesPath/local" ]; then
            echo "Libraries cache was not restored. Prepare job must succeed first." >&2
            exit 1
          fi

      - name: Build Wenzgram
        run: |
          cd %TBUILD%\tdesktop\Telegram
          call configure.bat x64 qt6 ^
            -D TDESKTOP_API_TEST=ON ^
            -D CMAKE_CONFIGURATION_TYPES=%BUILD_CONFIG% ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF
          cmake --build ..\out --config %BUILD_CONFIG% --parallel

      - name: Package artifact
        run: |
          set OUT=%TBUILD%\tdesktop\out\%BUILD_CONFIG%
          mkdir artifact
          copy /Y %OUT%\Telegram.exe artifact\Wenzgram.exe
          if exist %OUT%\WenzgramUpdater.exe copy /Y %OUT%\WenzgramUpdater.exe artifact\WenzgramUpdater.exe
          if exist %OUT%\Updater.exe copy /Y %OUT%\Updater.exe artifact\Updater.exe
          echo Wenzgram Windows x64 (%BUILD_CONFIG%) > artifact\README.txt
          echo Built from %GITHUB_SHA% >> artifact\README.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wenzgram-Windows-x64-Release
          path: artifact\
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/cursor/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_FILE="${TBUILD}/Wenzgram-src/telegram-desktop/Telegram/SourceFiles/wenzgram/wenzgram_version.h"
          VERSION=$(grep 'inline constexpr auto kVersion' "$VERSION_FILE" | sed 's/.*"\([^"]*\)".*/\1/')
          TAG=$(grep 'inline constexpr auto kVersionTag' "$VERSION_FILE" | sed 's/.*"\([^"]*\)".*/\1/')
          TITLE="Wenzgram ${VERSION} — Release (Windows x64)"
          NOTES="Release-сборка Wenzgram ${VERSION}.

          Новое в ${VERSION}:
          - NFT в профиле из ваших Telegram-подарков (unique gifts)
          - Кнопка «+» на своём фото в профиле для выбора NFT
          - NFT виден только вам локально, ничего не отправляется в чаты
          - Ускоренный CI: кэш библиотек, сборка ~2 часа вместо 4

          Также:
          - WenzgramUpdater, локальные обои, удалённые сообщения, защита сессии

          Файлы:
          - Wenzgram.exe — клиент
          - WenzgramUpdater.exe — установщик обновлений

          Собрано из ветки ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7}).
          Конфигурация: ${BUILD_CONFIG}."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifact/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" artifact/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
