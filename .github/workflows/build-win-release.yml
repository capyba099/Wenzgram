name: Build Wenzgram Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/**'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Wenzgram.exe (Release)
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      BUILD_CONFIG: Release

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories on D drive
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries\win64
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout Wenzgram
        uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\Wenzgram-src

      - name: Clone Telegram Desktop with submodules
        shell: bash
        run: |
          git clone --recursive --depth 1 -b dev \
            https://github.com/telegramdesktop/tdesktop.git \
            "$TBUILD/tdesktop"

      - name: Apply Wenzgram patches
        shell: bash
        run: |
          chmod +x "$TBUILD/Wenzgram-src/scripts/apply-wenzgram-patches.sh"
          "$TBUILD/Wenzgram-src/scripts/apply-wenzgram-patches.sh" \
            "$TBUILD/Wenzgram-src/telegram-desktop" \
            "$TBUILD/tdesktop"
          PREPARE_PY="$TBUILD/tdesktop/Telegram/build/prepare/prepare.py"
          sed -i 's|cd tools\\windows\\dump_syms|REM cd tools\\windows\\dump_syms|' "$PREPARE_PY"
          sed -i 's|gyp dump_syms.gyp --format=msvs|REM gyp dump_syms.gyp --format=msvs|' "$PREPARE_PY"
          sed -i 's|msbuild -m dump_syms.vcxproj.*|REM dump_syms skipped in CI|' "$PREPARE_PY"
          echo "Patched prepare.py: skipped dump_syms build"

      - name: Read SDK version and fix CMake
        shell: bash
        run: |
          DOCPATH=$TBUILD/tdesktop/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "release" >> CACHE_KEY.txt
          echo "$(sha256sum $TBUILD/tdesktop/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: wenzgram-${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            wenzgram-${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}
            wenzgram-${{ runner.os }}-x64-third-party-

      - name: Libraries cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: wenzgram-${{ runner.os }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: |
            wenzgram-${{ runner.os }}-x64-libs-${{ env.CACHE_KEY }}
            wenzgram-${{ runner.os }}-x64-libs-
            wenzgram-release-${{ runner.os }}-x64-libs-

      - name: Qt cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: wenzgram-${{ runner.os }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: |
            wenzgram-${{ runner.os }}-x64-qt6-${{ env.CACHE_KEY }}
            wenzgram-${{ runner.os }}-x64-qt6-
            wenzgram-release-${{ runner.os }}-x64-qt6-

      - name: Prepare libraries (Debug + Release)
        run: |
          %TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent qt6

      - name: Free disk space after prepare
        shell: bash
        run: |
          echo "Disk space:"
          df -h /d 2>/dev/null || wmic logicaldisk get size,freespace,caption
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete
          rm -rf "$TBUILD/tdesktop/.git" "$TBUILD/Wenzgram-src/.git" 2>/dev/null || true
          echo "Disk after cleanup:"
          df -h /d 2>/dev/null || wmic logicaldisk get size,freespace,caption

      - name: Build Wenzgram
        run: |
          cd %TBUILD%\tdesktop\Telegram
          call configure.bat x64 qt6 ^
            -D TDESKTOP_API_TEST=ON ^
            -D CMAKE_CONFIGURATION_TYPES=%BUILD_CONFIG% ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF
          cmake --build ..\out --config %BUILD_CONFIG% --parallel

      - name: Package artifact
        run: |
          set OUT=%TBUILD%\tdesktop\out\%BUILD_CONFIG%
          mkdir artifact
          copy /Y %OUT%\Telegram.exe artifact\Wenzgram.exe
          if exist %OUT%\Updater.exe copy /Y %OUT%\Updater.exe artifact\Updater.exe
          echo Wenzgram Windows x64 (%BUILD_CONFIG%) > artifact\README.txt
          echo Built from %GITHUB_SHA% >> artifact\README.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wenzgram-Windows-x64-Release
          path: artifact\
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/cursor/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.0-release"
          TITLE="Wenzgram 0.3.0 — Release (Windows x64)"
          NOTES="Release-сборка Wenzgram.

          Новое в этой версии:
          - Настройки Wenzgram (раздел в настройках)
          - Локальные обои для чатов
          - Отображение удалённых сообщений с меткой «УДАЛЕНО»
          - Защита сессии от копирования tdata

          - Wenzgram.exe — основной клиент (Release)
          - Updater.exe — обновлятор (если есть)

          Собрано из ветки ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7}).
          Конфигурация: ${BUILD_CONFIG}."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifact/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifact/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
